# Terminal por defecto de RuloGamerOS.
# Kitty se usa como terminal principal porque soporta su propio protocolo
# gráfico, necesario para que `fastfetch` (ver /usr/local/bin/fastfetch)
# renderice fotos reales del pack en vez de logos ASCII.

font_family      JetBrainsMono Nerd Font
font_size        11.0

enable_audio_bell no
confirm_os_window_close 0
window_padding_width 6

# Paleta de marca de RuloGamerOS (rojo/negro).
background            #0b0b0d
foreground            #e6e6e6
cursor                #e01b24
selection_background  #e01b24
selection_foreground  #0b0b0d

color0  #1a1a1a
color8  #4d4d4d
color1  #e01b24
color9  #ff5c5c
color2  #7ec699
color10 #a6e3a1
color3  #e0b11b
color11 #f0d264
color4  #4b8bbe
color12 #7aa2f7
color5  #b48ead
color13 #d5a6e0
color6  #56b6c2
color14 #7fdbca
color7  #d0d0d0
color15 #ffffff
